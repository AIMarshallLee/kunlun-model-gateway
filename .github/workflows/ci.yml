name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --extra postgres --extra test --python 3.12

      - name: Run the full test suite with branch coverage
        run: uv run --python 3.12 coverage run --branch -m pytest

      - name: Enforce coverage threshold
        run: uv run --python 3.12 coverage report --fail-under=80

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-python-3.12
          path: .coverage
          if-no-files-found: ignore

  cloudflare:
    name: Cloudflare Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript checks and Worker unit tests
        run: npm run check

      - name: Validate Worker bundle and Wrangler configuration
        run: npx wrangler deploy --dry-run --containers-rollout=none --outdir /tmp/kunlun-worker-dry-run

  vercel-container:
    name: Vercel container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build the Vercel container image
        run: docker build --file Dockerfile.vercel --tag kunlun-vercel-smoke .

      - name: Start the image and verify HTTP health
        run: |
          docker run --detach --name kunlun-vercel-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env PORT=8080 \
            --env KUNLUN_DATABASE_URL=sqlite:////tmp/kunlun-vercel-smoke.sqlite3 \
            kunlun-vercel-smoke
          trap 'docker logs kunlun-vercel-smoke; docker rm --force kunlun-vercel-smoke' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:18080/healthz
          curl --fail http://127.0.0.1:18080/readyz
