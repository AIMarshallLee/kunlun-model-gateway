# Additive override; never run alone. Keep the existing BYOK base unchanged.
# Only API and the one-shot preflight receive commercial configuration.
x-managed-environment: &managed-environment
  KUNLUN_PLATFORM_DAILY_BUDGET_MICROUSD: ${KUNLUN_PLATFORM_DAILY_BUDGET_MICROUSD:?set approved daily budget}
  KUNLUN_SUPPLIER_USE_ACKNOWLEDGED: ${KUNLUN_SUPPLIER_USE_ACKNOWLEDGED:?set supplier review status}
  KUNLUN_REQUIRE_EMAIL_VERIFICATION: ${KUNLUN_REQUIRE_EMAIL_VERIFICATION:?set email verification}
  KUNLUN_SMTP_URL: ${KUNLUN_SMTP_URL:?set SMTP URL}
  KUNLUN_EMAIL_FROM: ${KUNLUN_EMAIL_FROM:?set email sender}
  KUNLUN_PUBLIC_BASE_URL: ${KUNLUN_PUBLIC_BASE_URL:?set public base URL}
  KUNLUN_CAPTCHA_REQUIRED: ${KUNLUN_CAPTCHA_REQUIRED:?set CAPTCHA requirement}
  KUNLUN_CAPTCHA_PROVIDER: ${KUNLUN_CAPTCHA_PROVIDER:?set CAPTCHA provider}
  KUNLUN_CAPTCHA_SITE_KEY: ${KUNLUN_CAPTCHA_SITE_KEY:?set CAPTCHA site key}
  KUNLUN_CAPTCHA_EXPECTED_HOSTNAME: ${KUNLUN_CAPTCHA_EXPECTED_HOSTNAME:?set CAPTCHA hostname}
  KUNLUN_CAPTCHA_ENDPOINT: ${KUNLUN_CAPTCHA_ENDPOINT:?set CAPTCHA endpoint}
  KUNLUN_CAPTCHA_SECRET: ${KUNLUN_CAPTCHA_SECRET:?set CAPTCHA secret}
  KUNLUN_CAPTCHA_HOST_ALLOWLIST: ${KUNLUN_CAPTCHA_HOST_ALLOWLIST:?set CAPTCHA allowlist}
  KUNLUN_TERMS_URL: ${KUNLUN_TERMS_URL:?set reviewed terms URL}
  KUNLUN_PRIVACY_URL: ${KUNLUN_PRIVACY_URL:?set reviewed privacy URL}
  KUNLUN_COMPLAINT_EMAIL: ${KUNLUN_COMPLAINT_EMAIL:?set support mailbox}
  KUNLUN_COMPLIANCE_ACKNOWLEDGED: ${KUNLUN_COMPLIANCE_ACKNOWLEDGED:?set policy review status}
  KUNLUN_CONTENT_SAFETY_REQUIRED: ${KUNLUN_CONTENT_SAFETY_REQUIRED:?set content safety requirement}
  KUNLUN_CONTENT_SAFETY_ENDPOINT: ${KUNLUN_CONTENT_SAFETY_ENDPOINT:?set safety endpoint}
  KUNLUN_CONTENT_SAFETY_API_KEY: ${KUNLUN_CONTENT_SAFETY_API_KEY:?set safety secret}
  KUNLUN_CONTENT_SAFETY_HOST_ALLOWLIST: ${KUNLUN_CONTENT_SAFETY_HOST_ALLOWLIST:?set safety allowlist}
  KUNLUN_CONTENT_SAFETY_POLICY_VERSION: ${KUNLUN_CONTENT_SAFETY_POLICY_VERSION:?set safety policy version}
  KUNLUN_PAYMENT_PROVIDER: ${KUNLUN_PAYMENT_PROVIDER:?set approved payment provider}
  KUNLUN_PAYMENT_BRIDGE_ENDPOINT: ${KUNLUN_PAYMENT_BRIDGE_ENDPOINT:?set payment bridge endpoint}
  KUNLUN_PAYMENT_BRIDGE_MERCHANT_ID: ${KUNLUN_PAYMENT_BRIDGE_MERCHANT_ID:?set merchant ID}
  KUNLUN_PAYMENT_BRIDGE_SECRET: ${KUNLUN_PAYMENT_BRIDGE_SECRET:?set payment bridge secret}
  KUNLUN_PAYMENT_BRIDGE_HOST_ALLOWLIST: ${KUNLUN_PAYMENT_BRIDGE_HOST_ALLOWLIST:?set payment allowlist}
  KUNLUN_PAYMENT_BRIDGE_OFFICIAL_SDK_ACKNOWLEDGED: ${KUNLUN_PAYMENT_BRIDGE_OFFICIAL_SDK_ACKNOWLEDGED:?set SDK verification status}
  KUNLUN_TOPUP_PACKAGES_JSON: ${KUNLUN_TOPUP_PACKAGES_JSON:?set approved SKUs}
  KUNLUN_MAX_ACTIVE_API_KEYS: ${KUNLUN_MAX_ACTIVE_API_KEYS:-5}
  KUNLUN_MAX_OUTPUT_TOKENS: ${KUNLUN_MAX_OUTPUT_TOKENS:-4096}
  KUNLUN_DEFAULT_OUTPUT_TOKENS: ${KUNLUN_DEFAULT_OUTPUT_TOKENS:-256}

services:
  preflight:
    environment: *managed-environment
    command: ["kunlun-production-preflight", "--require-managed-launch"]
  api:
    environment: *managed-environment
