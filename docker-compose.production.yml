services:
  migrate:
    build: .
    restart: "no"
    environment:
      KUNLUN_DATABASE_URL: ${KUNLUN_MIGRATOR_DATABASE_URL:?set KUNLUN_MIGRATOR_DATABASE_URL}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [kunlun-internal]

  preflight:
    # Do not let API/maintenance start until the runtime role, exact schema
    # head, append-only triggers and permissions have been checked against the
    # migrated database. This is a one-shot gate, not a second migrator.
    build: .
    restart: "no"
    environment:
      KUNLUN_DATABASE_URL: ${KUNLUN_RUNTIME_DATABASE_URL:?set KUNLUN_RUNTIME_DATABASE_URL}
      KUNLUN_RUNTIME_DATABASE_URL: ${KUNLUN_RUNTIME_DATABASE_URL:?set KUNLUN_RUNTIME_DATABASE_URL}
      KUNLUN_MIGRATOR_DATABASE_URL: ${KUNLUN_MIGRATOR_DATABASE_URL:?set KUNLUN_MIGRATOR_DATABASE_URL}
      KUNLUN_VAULT_EXECUTOR_DATABASE_URL: ${KUNLUN_VAULT_EXECUTOR_DATABASE_URL:?set KUNLUN_VAULT_EXECUTOR_DATABASE_URL}
      KUNLUN_ENV: ${KUNLUN_ENV:?set KUNLUN_ENV}
      KUNLUN_GATEWAY_MODE: ${KUNLUN_GATEWAY_MODE:?set KUNLUN_GATEWAY_MODE}
      KUNLUN_VAULT_BACKEND: ${KUNLUN_VAULT_BACKEND:?set KUNLUN_VAULT_BACKEND}
      KUNLUN_PUBLIC_SIGNUP: ${KUNLUN_PUBLIC_SIGNUP:?set KUNLUN_PUBLIC_SIGNUP}
      KUNLUN_ENABLE_TEST_PAYMENTS: ${KUNLUN_ENABLE_TEST_PAYMENTS:?set KUNLUN_ENABLE_TEST_PAYMENTS}
      KUNLUN_LIVE_PAYMENTS: ${KUNLUN_LIVE_PAYMENTS:?set KUNLUN_LIVE_PAYMENTS}
      KUNLUN_LIVE_UPSTREAM: ${KUNLUN_LIVE_UPSTREAM:?set KUNLUN_LIVE_UPSTREAM}
      KUNLUN_API_KEY_PEPPER: ${KUNLUN_API_KEY_PEPPER:?set KUNLUN_API_KEY_PEPPER}
      KUNLUN_SESSION_PEPPER: ${KUNLUN_SESSION_PEPPER:?set KUNLUN_SESSION_PEPPER}
      KUNLUN_IDENTITY_TOKEN_PEPPER: ${KUNLUN_IDENTITY_TOKEN_PEPPER:?set KUNLUN_IDENTITY_TOKEN_PEPPER}
      KUNLUN_OPERATOR_SIGNING_SECRET: ${KUNLUN_OPERATOR_SIGNING_SECRET:?set KUNLUN_OPERATOR_SIGNING_SECRET}
      KUNLUN_OPS_PRIVATE_ACCESS_ACKNOWLEDGED: ${KUNLUN_OPS_PRIVATE_ACCESS_ACKNOWLEDGED:?set KUNLUN_OPS_PRIVATE_ACCESS_ACKNOWLEDGED}
      KUNLUN_TRUSTED_PROXY_CIDRS: ${KUNLUN_TRUSTED_PROXY_CIDRS:-}
      KUNLUN_TRUSTED_PROXY_SECRET: ${KUNLUN_TRUSTED_PROXY_SECRET:-}
      KUNLUN_INGRESS_PROVIDER: ${KUNLUN_INGRESS_PROVIDER:-}
      KUNLUN_OPS_INGRESS_SECRET: ${KUNLUN_OPS_INGRESS_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      KUNLUN_RATE_LIMIT_PER_MINUTE: ${KUNLUN_RATE_LIMIT_PER_MINUTE:-60}
      KUNLUN_CHECKOUT_RATE_LIMIT_PER_MINUTE: ${KUNLUN_CHECKOUT_RATE_LIMIT_PER_MINUTE:-5}
      KUNLUN_MAX_OPEN_CHECKOUT_ORDERS: ${KUNLUN_MAX_OPEN_CHECKOUT_ORDERS:-3}
      KUNLUN_MODEL_RESERVATION_LEASE_SECONDS: ${KUNLUN_MODEL_RESERVATION_LEASE_SECONDS:-300}
      KUNLUN_PROVIDERS_JSON: ${KUNLUN_PROVIDERS_JSON:?set KUNLUN_PROVIDERS_JSON}
      KUNLUN_PROVIDER_HOST_ALLOWLIST: ${KUNLUN_PROVIDER_HOST_ALLOWLIST:?set KUNLUN_PROVIDER_HOST_ALLOWLIST}
      KUNLUN_MODELS_JSON: ${KUNLUN_MODELS_JSON:?set KUNLUN_MODELS_JSON}
    command: ["kunlun-production-preflight"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [kunlun-internal]

  api:
    build: .
    restart: unless-stopped
    environment:
      KUNLUN_DATABASE_URL: ${KUNLUN_RUNTIME_DATABASE_URL:?set KUNLUN_RUNTIME_DATABASE_URL}
      KUNLUN_VAULT_EXECUTOR_DATABASE_URL: ${KUNLUN_VAULT_EXECUTOR_DATABASE_URL:?set KUNLUN_VAULT_EXECUTOR_DATABASE_URL}
      KUNLUN_ENV: ${KUNLUN_ENV:?set KUNLUN_ENV}
      KUNLUN_GATEWAY_MODE: ${KUNLUN_GATEWAY_MODE:?set KUNLUN_GATEWAY_MODE}
      KUNLUN_VAULT_BACKEND: ${KUNLUN_VAULT_BACKEND:?set KUNLUN_VAULT_BACKEND}
      KUNLUN_PUBLIC_SIGNUP: ${KUNLUN_PUBLIC_SIGNUP:?set KUNLUN_PUBLIC_SIGNUP}
      KUNLUN_ENABLE_TEST_PAYMENTS: ${KUNLUN_ENABLE_TEST_PAYMENTS:?set KUNLUN_ENABLE_TEST_PAYMENTS}
      KUNLUN_LIVE_PAYMENTS: ${KUNLUN_LIVE_PAYMENTS:?set KUNLUN_LIVE_PAYMENTS}
      KUNLUN_LIVE_UPSTREAM: ${KUNLUN_LIVE_UPSTREAM:?set KUNLUN_LIVE_UPSTREAM}
      KUNLUN_API_KEY_PEPPER: ${KUNLUN_API_KEY_PEPPER:?set KUNLUN_API_KEY_PEPPER}
      KUNLUN_SESSION_PEPPER: ${KUNLUN_SESSION_PEPPER:?set KUNLUN_SESSION_PEPPER}
      KUNLUN_IDENTITY_TOKEN_PEPPER: ${KUNLUN_IDENTITY_TOKEN_PEPPER:?set KUNLUN_IDENTITY_TOKEN_PEPPER}
      KUNLUN_OPERATOR_SIGNING_SECRET: ${KUNLUN_OPERATOR_SIGNING_SECRET:?set KUNLUN_OPERATOR_SIGNING_SECRET}
      KUNLUN_OPS_PRIVATE_ACCESS_ACKNOWLEDGED: ${KUNLUN_OPS_PRIVATE_ACCESS_ACKNOWLEDGED:?set KUNLUN_OPS_PRIVATE_ACCESS_ACKNOWLEDGED}
      KUNLUN_TRUSTED_PROXY_CIDRS: ${KUNLUN_TRUSTED_PROXY_CIDRS:-}
      KUNLUN_TRUSTED_PROXY_SECRET: ${KUNLUN_TRUSTED_PROXY_SECRET:-}
      KUNLUN_INGRESS_PROVIDER: ${KUNLUN_INGRESS_PROVIDER:-}
      KUNLUN_OPS_INGRESS_SECRET: ${KUNLUN_OPS_INGRESS_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      KUNLUN_RATE_LIMIT_PER_MINUTE: ${KUNLUN_RATE_LIMIT_PER_MINUTE:-60}
      KUNLUN_CHECKOUT_RATE_LIMIT_PER_MINUTE: ${KUNLUN_CHECKOUT_RATE_LIMIT_PER_MINUTE:-5}
      KUNLUN_MAX_OPEN_CHECKOUT_ORDERS: ${KUNLUN_MAX_OPEN_CHECKOUT_ORDERS:-3}
      KUNLUN_MODEL_RESERVATION_LEASE_SECONDS: ${KUNLUN_MODEL_RESERVATION_LEASE_SECONDS:-300}
      KUNLUN_PROVIDERS_JSON: ${KUNLUN_PROVIDERS_JSON:?set KUNLUN_PROVIDERS_JSON}
      KUNLUN_PROVIDER_HOST_ALLOWLIST: ${KUNLUN_PROVIDER_HOST_ALLOWLIST:?set KUNLUN_PROVIDER_HOST_ALLOWLIST}
      KUNLUN_MODELS_JSON: ${KUNLUN_MODELS_JSON:?set KUNLUN_MODELS_JSON}
    expose: ["8787"]
    depends_on:
      preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [kunlun-internal]

  maintenance:
    build: .
    restart: unless-stopped
    environment:
      KUNLUN_DATABASE_URL: ${KUNLUN_RUNTIME_DATABASE_URL:?set KUNLUN_RUNTIME_DATABASE_URL}
      # Maintenance does not serve requests or resolve credentials.  Its
      # isolated settings profile keeps the long-lived process from receiving
      # API/Vault/ingress secrets while retaining production-safe feature flags.
      KUNLUN_ENV: staging
      KUNLUN_GATEWAY_MODE: disabled
      KUNLUN_VAULT_BACKEND: disabled
      KUNLUN_PUBLIC_SIGNUP: "false"
      KUNLUN_ENABLE_TEST_PAYMENTS: "false"
      KUNLUN_LIVE_PAYMENTS: "false"
      KUNLUN_LIVE_UPSTREAM: "false"
      KUNLUN_MODEL_RESERVATION_LEASE_SECONDS: ${KUNLUN_MODEL_RESERVATION_LEASE_SECONDS:-300}
    command: ["python", "-m", "scripts.maintenance", "--interval-seconds", "60"]
    depends_on:
      preflight:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [kunlun-internal]

  caddy:
    # Pin a published Caddy tag; do not use floating `latest` in production.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    networks:
      kunlun-internal:
        ipv4_address: 172.30.50.2

volumes:
  caddy-data:
  caddy-config:

networks:
  kunlun-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.50.0/24
