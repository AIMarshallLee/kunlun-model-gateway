[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kunlun-model-gateway"
version = "0.1.0"
description = "Budgeted multi-provider model gateway for Kunlun products"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.24,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["coverage>=7.6,<8", "pytest>=7.4,<9"]

[project.scripts]
kunlun-opencode-install = "scripts.opencode_install:main"
kunlun-mint-ops-token = "scripts.mint_ops_token:main"
kunlun-production-preflight = "scripts.preflight:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]
scripts = ["assets/*.js"]

[tool.setuptools]
py-modules = ["gateway"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["tests*"]

[tool.coverage.run]
branch = true
source = ["app", "gateway"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
